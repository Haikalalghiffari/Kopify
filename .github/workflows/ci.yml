name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-check:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koperasi_user
          POSTGRES_PASSWORD: koperasi_pass
          POSTGRES_DB: koperasi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://koperasi_user:koperasi_pass@localhost:5432/koperasi_test_db?schema=public"
      TEST_DATABASE_URL: "postgresql://koperasi_user:koperasi_pass@localhost:5432/koperasi_test_db?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci_secret_super_secret_key_minimum_32_chars_koperasi"
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type-Check
        run: npm run type-check

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Verify Production Build
        run: npm run build
